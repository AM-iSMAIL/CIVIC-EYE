<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CivicEye - AI Urban Intelligence</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #fbfcfd;
      color: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .logo-container {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
    }
    .eye-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid #2563eb;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .eye-pupil {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #2563eb;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #090d16;
      margin-bottom: 6px;
    }
    .tagline {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #2563eb;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .loader-bar {
      width: 140px;
      height: 4px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .loader-progress {
      position: absolute;
      left: -50%;
      height: 100%;
      width: 50%;
      background: #2563eb;
      border-radius: 999px;
      animation: indeterminate 1.4s infinite ease-in-out;
    }
    @keyframes indeterminate {
      0% { left: -50%; width: 50%; }
      50% { left: 25%; width: 50%; }
      100% { left: 100%; width: 50%; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="eye-icon">
      <div class="eye-pupil"></div>
    </div>
  </div>
  <h1>CIVIC EYE</h1>
  <div class="tagline">AI URBAN INTELLIGENCE</div>
  <div class="loader-bar">
    <div class="loader-progress"></div>
  </div>
  <script>
    // Seamless automatic redirect to live connected platform
    window.location.replace("https://civic-eye-two.vercel.app");
  </script>
</body>
</html>
